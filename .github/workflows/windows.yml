name: Windows

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        env:
        - TARGET: x86_64-pc-windows-msvc
        - TARGET: i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
      with:
        persist-credentials: false
    - name: Install Rust
      run: rustup install stable -t ${env:TARGET} && rustup default stable
      shell: pwsh
      env:
        TARGET: ${{ matrix.env.TARGET }}
    - name: Build and test
      env:
        TARGET: ${{ matrix.env.TARGET }}
      run: |
        rustc -V
        cargo -V
        cargo test --no-run --target $env:TARGET
        cargo run --manifest-path systest/Cargo.toml --target $env:TARGET
        cargo test --no-run --target $env:TARGET --features openssl-on-win32,vendored-openssl
      shell: pwsh
